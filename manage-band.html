<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Banda - Nando Denon</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .band-manager {
            padding: 80px 20px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .band-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .band-header h1 {
            color: #ff6b00;
            margin: 0;
            font-size: 24px;
        }

        .band-members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 107, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .member-card:hover {
            transform: translateY(-5px);
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .member-avatar {
            width: 60px;
            height: 60px;
            background: rgba(255, 107, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ff6b00;
        }

        .member-info h3 {
            color: #ff6b00;
            margin: 0;
            font-size: 18px;
        }

        .member-info p {
            color: rgba(255, 255, 255, 0.7);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .member-details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .member-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: white;
        }

        .member-detail i {
            color: #ff6b00;
            width: 20px;
        }

        .member-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .member-stat {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .member-stat .number {
            font-size: 20px;
            color: #ff6b00;
            margin-bottom: 5px;
        }

        .member-stat .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .member-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: #ff6b00;
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .payment-history {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .payment-history h2 {
            color: #ff6b00;
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .payment-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .payment-table th,
        .payment-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .payment-table th {
            color: #ff6b00;
            font-weight: 600;
        }

        .payment-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .band-members-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="assets/Logos/Logo Branco.png" alt="Nando Denon">
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Voltar ao Site</a></li>
                <li><a href="dashboard.html">Admin</a></li>
                <li><a href="manage-calendar.html">Agenda</a></li>
                <li><a href="manage-finance.html">Financeiro</a></li>
                <li><a href="manage-band.html" class="active">Banda</a></li>
                <li><a href="manage-settings.html">Configurações</a></li>
                <li><a href="#" class="logout-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</a></li>
            </ul>
        </nav>
        <div class="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <div class="band-manager">
        <div class="container">
            <div class="band-header">
                <div>
                    <h1>Gerenciar Banda</h1>
                    <p style="color: white; margin: 5px 0 0 0;">Controle de membros e pagamentos</p>
                </div>
                <button class="btn btn-primary" onclick="showAddMemberModal()">
                    <i class="fas fa-user-plus"></i>
                    Novo Membro
                </button>
            </div>

            <div class="band-members-grid" id="bandMembersGrid">
                <!-- Membros serão carregados dinamicamente aqui -->
            </div>

            <div class="payment-history">
                <h2>Histórico de Pagamentos</h2>
                <table class="payment-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Membro</th>
                            <th>Show</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="paymentHistoryTable">
                        <!-- Pagamentos serão carregados dinamicamente aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Novo Membro -->
    <div id="memberModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div class="modal-content" style="position: relative; background: #1a1a1a; margin: 10% auto; padding: 20px; width: 90%; max-width: 600px; border-radius: 10px; border: 1px solid rgba(255,107,0,0.3);">
            <h2 style="color: #ff6b00; margin-top: 0;">Novo Membro da Banda</h2>
            <form id="memberForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Instrumento</label>
                        <input type="text" name="instrument" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="tel" name="phone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>Valor por Show</label>
                    <input type="number" name="showRate" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Novo Pagamento -->
    <div id="paymentModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div class="modal-content" style="position: relative; background: #1a1a1a; margin: 10% auto; padding: 20px; width: 90%; max-width: 600px; border-radius: 10px; border: 1px solid rgba(255,107,0,0.3);">
            <h2 style="color: #ff6b00; margin-top: 0;">Novo Pagamento</h2>
            <form id="paymentForm">
                <input type="hidden" name="memberId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Show</label>
                        <select name="showId" required>
                            <!-- Shows serão carregados dinamicamente aqui -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Valor</label>
                        <input type="number" name="amount" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closePaymentModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/site-data.js"></script>
    <script src="js/finance-manager.js"></script>
    <script>
        let financeManager;

        // Inicialização
        async function initBandManager() {
            try {
                financeManager = await FinanceManager.init();
                await updateBandMembers();
                await updatePaymentHistory();
            } catch (error) {
                console.error('Erro ao inicializar gerenciador da banda:', error);
                alert('Erro ao carregar dados da banda');
            }
        }

        // Atualização dos Membros
        async function updateBandMembers() {
            const grid = document.getElementById('bandMembersGrid');
            const analytics = financeManager.getBandAnalytics();

            grid.innerHTML = analytics.map(member => `
                <div class="member-card">
                    <div class="member-header">
                        <div class="member-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="member-info">
                            <h3>${member.name}</h3>
                            <p>${member.instrument}</p>
                        </div>
                    </div>
                    <div class="member-details">
                        <div class="member-detail">
                            <i class="fas fa-phone"></i>
                            <span>${member.phone || 'Não informado'}</span>
                        </div>
                        <div class="member-detail">
                            <i class="fas fa-envelope"></i>
                            <span>${member.email || 'Não informado'}</span>
                        </div>
                        <div class="member-detail">
                            <i class="fas fa-dollar-sign"></i>
                            <span>R$ ${member.showRate.toFixed(2)} por show</span>
                        </div>
                    </div>
                    <div class="member-stats">
                        <div class="member-stat">
                            <div class="number">${member.showsParticipated}</div>
                            <div class="label">Shows</div>
                        </div>
                        <div class="member-stat">
                            <div class="number">R$ ${member.totalPayments.toFixed(2)}</div>
                            <div class="label">Recebido (mês)</div>
                        </div>
                    </div>
                    <div class="member-actions">
                        <button class="btn btn-primary" onclick="showPaymentModal('${member.id}')">
                            <i class="fas fa-dollar-sign"></i>
                            Pagar
                        </button>
                        <button class="btn btn-secondary" onclick="editMember('${member.id}')">
                            <i class="fas fa-edit"></i>
                            Editar
                        </button>
                        <button class="btn btn-secondary" onclick="deleteMember('${member.id}')">
                            <i class="fas fa-trash"></i>
                            Excluir
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Atualização do Histórico de Pagamentos
        async function updatePaymentHistory() {
            const tbody = document.getElementById('paymentHistoryTable');
            const payments = financeManager.transactions
                .filter(t => t.category === 'pagamento-banda')
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .slice(0, 10);

            tbody.innerHTML = payments.map(payment => {
                const member = financeManager.bandMembers.find(m => m.id === payment.memberId);
                const show = financeManager.shows.find(s => s.id === payment.showId);

                return `
                    <tr>
                        <td>${new Date(payment.date).toLocaleDateString('pt-BR')}</td>
                        <td>${member ? member.name : 'Membro não encontrado'}</td>
                        <td>${show ? show.title : 'Show não encontrado'}</td>
                        <td>R$ ${payment.amount.toFixed(2)}</td>
                        <td>
                            <span class="status-badge" style="
                                background: ${payment.status === 'pago' ? '#2ecc71' : '#e74c3c'};
                                padding: 3px 8px;
                                border-radius: 3px;
                                font-size: 12px;
                            ">
                                ${payment.status || 'Pendente'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 5px 10px;" onclick="editPayment('${payment.id}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-secondary" style="padding: 5px 10px;" onclick="deletePayment('${payment.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Funções dos Modais
        function showAddMemberModal() {
            document.getElementById('memberModal').style.display = 'block';
        }

        function closeMemberModal() {
            document.getElementById('memberModal').style.display = 'none';
        }

        function showPaymentModal(memberId) {
            const modal = document.getElementById('paymentModal');
            modal.querySelector('[name="memberId"]').value = memberId;
            
            // Carregar shows disponíveis
            const showSelect = modal.querySelector('[name="showId"]');
            const shows = financeManager.shows
                .filter(show => new Date(show.date) <= new Date())
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            showSelect.innerHTML = shows.map(show => `
                <option value="${show.id}">${show.title} - ${new Date(show.date).toLocaleDateString('pt-BR')}</option>
            `).join('');

            modal.style.display = 'block';
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        // Handlers de Formulários
        document.getElementById('memberForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            const member = {
                name: formData.get('name'),
                instrument: formData.get('instrument'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                showRate: parseFloat(formData.get('showRate')),
                notes: formData.get('notes')
            };

            try {
                await financeManager.addBandMember(member);
                closeMemberModal();
                await updateBandMembers();
                this.reset();
            } catch (error) {
                console.error('Erro ao adicionar membro:', error);
                alert('Erro ao salvar membro da banda');
            }
        });

        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            const payment = {
                memberId: formData.get('memberId'),
                showId: formData.get('showId'),
                amount: parseFloat(formData.get('amount')),
                date: formData.get('date'),
                notes: formData.get('notes'),
                category: 'pagamento-banda',
                type: 'despesa',
                status: 'pago'
            };

            try {
                await financeManager.addTransaction(payment);
                closePaymentModal();
                await updateBandMembers();
                await updatePaymentHistory();
                this.reset();
            } catch (error) {
                console.error('Erro ao adicionar pagamento:', error);
                alert('Erro ao salvar pagamento');
            }
        });

        // Funções de Edição e Exclusão
        async function editMember(memberId) {
            const member = financeManager.bandMembers.find(m => m.id === memberId);
            if (!member) return;

            const form = document.getElementById('memberForm');
            form.querySelector('[name="name"]').value = member.name;
            form.querySelector('[name="instrument"]').value = member.instrument;
            form.querySelector('[name="phone"]').value = member.phone || '';
            form.querySelector('[name="email"]').value = member.email || '';
            form.querySelector('[name="showRate"]').value = member.showRate;
            form.querySelector('[name="notes"]').value = member.notes || '';

            showAddMemberModal();
        }

        async function deleteMember(memberId) {
            if (!confirm('Tem certeza que deseja excluir este membro?')) return;

            try {
                await financeManager.deleteBandMember(memberId);
                await updateBandMembers();
                await updatePaymentHistory();
            } catch (error) {
                console.error('Erro ao excluir membro:', error);
                alert('Erro ao excluir membro');
            }
        }

        async function editPayment(paymentId) {
            const payment = financeManager.transactions.find(t => t.id === paymentId);
            if (!payment) return;

            const form = document.getElementById('paymentForm');
            form.querySelector('[name="memberId"]').value = payment.memberId;
            form.querySelector('[name="showId"]').value = payment.showId;
            form.querySelector('[name="amount"]').value = payment.amount;
            form.querySelector('[name="date"]').value = payment.date;
            form.querySelector('[name="notes"]').value = payment.notes || '';

            showPaymentModal(payment.memberId);
        }

        async function deletePayment(paymentId) {
            if (!confirm('Tem certeza que deseja excluir este pagamento?')) return;

            try {
                await financeManager.deleteTransaction(paymentId);
                await updateBandMembers();
                await updatePaymentHistory();
            } catch (error) {
                console.error('Erro ao excluir pagamento:', error);
                alert('Erro ao excluir pagamento');
            }
        }

        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', initBandManager);
    </script>
</body>
</html>
